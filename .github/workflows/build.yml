name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Obfuscate source with PyArmor (best-effort code protection)
        continue-on-error: true
        run: |
          pyarmor gen -O dist_obf --recursive main.py settings.py version.py auth.py updater.py pdf_reader.py pharmacy_directory.py missing_items.py turbo.py engine ui

      - name: Build EXE with PyInstaller (obfuscated build if available)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # ملاحظة مهمة: لما PyArmor يشفّر الكود، PyInstaller بيبقى مش قادر
          # يكتشف الاستيرادات (imports) جوه الملفات المشفّرة عن طريق تحليل
          # النص العادي، فلازم نصرّح له بكل موديلاتنا المحلية والمكتبات
          # الخارجية يدوياً عبر --hidden-import حتى لو كانت مكتشفة تلقائياً
          # في البناء العادي (غير المشفَّر).
          $hiddenImports = @(
            "settings", "version", "auth", "updater", "pdf_reader", "pharmacy_directory", "missing_items", "turbo",
            "engine", "engine.cleaner", "engine.lexical_dict", "engine.transliteration",
            "engine.matcher", "engine.exceptions_manager", "engine.ignored_items_manager", "engine.pipeline",
            "engine.reference_map", "engine.controlled_items", "engine.cloud_sync",
            "ui", "ui.app",
            "customtkinter", "pandas", "openpyxl", "rapidfuzz", "pdfplumber", "pyperclip",
            "arabic_reshaper", "bidi", "bidi.algorithm", "cryptography", "cryptography.fernet",
            "tkinter", "tkinter.ttk", "tkinter.filedialog", "tkinter.messagebox"
          )
          $hiddenArgs = $hiddenImports | ForEach-Object { "--hidden-import=$_" }

          # مهم: PyArmor (النسخة المجانية) عندها حد أقصى لعدد/حجم الملفات
          # يقدر يشفّرها. لما نتخطاه، بيفشل بصمت في تشفير بعض الملفات
          # الكبيرة (زي ui/app.py) ويكمل عادي من غير ما يوقف العملية كلها،
          # فيطلع لنا مجلد dist_obf ناقص ملف حرج -> exe هيكرش فوراً عند
          # التشغيل. عشان كده، بدل ما نتأكد بس من وجود main.py، نتأكد من
          # وجود كل الملفات الحرجة قبل ما نثق في البناء المشفَّر أصلاً.
          $criticalObfFiles = @(
            "dist_obf/main.py", "dist_obf/ui/app.py", "dist_obf/engine/pipeline.py",
            "dist_obf/engine/matcher.py", "dist_obf/pharmacy_directory.py", "dist_obf/auth.py"
          )
          $obfComplete = $true
          foreach ($f in $criticalObfFiles) {
            if (-not (Test-Path $f)) { $obfComplete = $false }
          }

          if ($obfComplete) {
            Write-Host "PyArmor obfuscation produced all critical files - using the obfuscated build."
            Push-Location dist_obf
            pyinstaller --onefile --noconsole --noupx --name YAPharmaScan --icon "../app_icon.ico" `
              --add-data "../data;data" `
              --add-data "../app_icon.ico;." `
              --add-data "../app_icon_32.png;." `
              --add-data "../app_icon_48.png;." `
              @hiddenArgs `
              --collect-all=customtkinter --collect-all=numpy --collect-all=bidi --collect-all=cryptography `
              --collect-submodules=openpyxl --collect-submodules=rapidfuzz --collect-submodules=pdfplumber `
              main.py
            Pop-Location
            Copy-Item "dist_obf/dist/YAPharmaScan.exe" "dist/YAPharmaScan.exe" -Force
          } else {
            Write-Host "PyArmor obfuscation incomplete (likely hit the free-tier file/size limit) - falling back to the non-obfuscated build so the app still works correctly."
            pyinstaller --onefile --noconsole --noupx --name YAPharmaScan --icon "app_icon.ico" `
              --add-data "data;data" `
              --add-data "app_icon.ico;." `
              --add-data "app_icon_32.png;." `
              --add-data "app_icon_48.png;." `
              --collect-all=customtkinter --collect-all=numpy --collect-all=bidi --collect-all=cryptography `
              main.py
          }

          if (-not (Test-Path "dist/YAPharmaScan.exe")) {
            Write-Error "YAPharmaScan.exe was not produced - failing the build."
            exit 1
          }

      - name: Smoke-test the built EXE (must actually launch, not crash)
        shell: pwsh
        run: |
          # الاختبار النهائي الحاسم: نشغّل الـ exe فعلياً على ويندوز حقيقي
          # هنا في الـ CI، ونتأكد إنه لسه شغال بعد كام ثانية (يعني وصل
          # لشاشة كلمة المرور بسلام) بدل ما يكرش فوراً بسبب أي مشكلة في
          # تجميع المكتبات (زي ModuleNotFoundError). لو كرش، نوقف البناء
          # كله فوراً بدل ما نسيب ملف مكسور يوصل للمستخدم.
          $proc = Start-Process -FilePath "dist\YAPharmaScan.exe" -PassThru
          Start-Sleep -Seconds 8

          if ($proc.HasExited) {
            Write-Host "##[error] YAPharmaScan.exe crashed/exited within 8 seconds of launch (exit code $($proc.ExitCode))."
            Write-Host "##[error] This means the build is broken (most likely a missing module) - failing the workflow so a broken EXE never gets uploaded."
            exit 1
          } else {
            Write-Host "YAPharmaScan.exe is still running after 8 seconds - smoke test passed, build is healthy."
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: YA-Pharma-Scan-windows-exe
          path: dist/YAPharmaScan.exe
          retention-days: 3

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YAPharmaScan.exe
